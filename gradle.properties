# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official

# AAPT2 Fixes for Windows
# 1. Force AAPT2 to be downloaded from Maven instead of using the bundled one
android.aapt2FromMaven=true
# 2. Disable the AAPT2 daemon to prevent the startup timeout error
android.enableAapt2Daemon=false
# 3. Increase timeout for AAPT2 if it does run (some AGP versions respect this)
com.android.build.gradle.override.aapt2timeout=90
